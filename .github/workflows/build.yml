name: Build and Release

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  # 固定 Qt 版本，避免 install-qt-action 默认行为变化导致构建不可复现。
  #
  # 为什么不升到 6.11.x/6.12：它们的 Windows 包尚未发布（Updates.xml 404），
  # 只有 macOS/Linux 可用，Windows 构建会直接失败。
  # 6.10.3 是当前三平台都有完整发布的最高版本。
  #
  # 为什么不留在 6.7.0：其 macOS 官方包在 CMake config 里硬编码了
  # -framework AGL，而 AGL 已在 macOS 26 (Tahoe) 中被移除，
  # macos-latest 漂移到 macOS 26 后链接必然失败。6.10.3 已无该引用。
  QT_VERSION: '6.10.3'

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '${{ env.QT_VERSION }}'
          modules: 'qtmultimedia'
      
      - name: Build
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release
      
      - name: Deploy Qt
        run: |
          macdeployqt build/tts.app
      
      - name: Sign
        run: |
          codesign --force --deep -s - build/tts.app
      
      - name: Package
        run: |
          cd build && tar -czf ../tts-macos.tar.gz tts.app
      
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: tts-macos
          path: tts-macos.tar.gz

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '${{ env.QT_VERSION }}'
          modules: 'qtmultimedia'
      
      - name: Build
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release
      
      - name: Deploy Qt
        run: |
          windeployqt build\Release\tts.exe
      
      - name: Package
        run: Compress-Archive -Path build\Release\* -DestinationPath tts-windows.zip
      
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: tts-windows
          path: tts-windows.zip

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev libglib2.0-dev
      
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '${{ env.QT_VERSION }}'
          modules: 'qtmultimedia'
      
      - name: Build
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release
      
      - name: Package
        run: |
          mkdir -p release
          cp build/tts release/
          cd release && tar -czf ../tts-linux.tar.gz *
      
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: tts-linux
          path: tts-linux.tar.gz

  release:
    needs: [build-macos, build-windows, build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      
      - name: Generate tag
        id: tag
        run: |
          TAG="v$(date +%Y%m%d-%H%M%S)"
          echo "tag=$TAG" >> $GITHUB_OUTPUT
      
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: "Release ${{ steps.tag.outputs.tag }}"
          files: |
            artifacts/tts-macos/tts-macos.tar.gz
            artifacts/tts-windows/tts-windows.zip
            artifacts/tts-linux/tts-linux.tar.gz
          generate_release_notes: true
